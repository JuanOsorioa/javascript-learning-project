<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="./style.css" />
    <title>Ejercicio 10</title>
  </head>
  <body>
    <main>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="circulo-g" id="luzVerde"></div>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="circulo-y" id="luzAmarilla"></div>
                </div>
            </div>
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="circulo" id="luzRoja"></div>
                </div>
            </div>
        </div>
        <div class="container mt-5">
            <div class="row">
                <div class="col-md-4">
                    <button class="btn btn-success" id="botonVerde">Sigue</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-warning" id="botonAmarillo">Reduce la velocidad</button>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-danger" id="botonRojo">Detente</button>
                </div>
            </div>
        </div>
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-12">
                    <h1 id="mensaje"></h1>
                </div>
            </div>
        </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
