<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 12</title>
  </head>
  <body>
    <main>
      <h1>Generador tabla de multiplicar</h1>
      <div>
        <h1>Ingresa el número para ver su tabla de multiplicar</h1>
        <br>
        <label for="campo">Del 1 al 10</label>
        <input type="number" id="campo" min="1" max="10" step="1">
        <br>
        <button id="boton">Generar tabla</button>
      </div>
      <div>
        <table>
          <thead>
            <tr>
              <th>N1</th>
              <th>N2</th>
              <th>Resultado</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td class="numero">1</td>
              <td class="n2">1</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">2</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">3</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">4</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">5</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">6</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">7</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">8</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">9</td>
              <td class="resultado"></td>
            </tr>
             <tr>
              <td class="numero">1</td>
              <td class="n2">10</td>
              <td class="resultado"></td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
